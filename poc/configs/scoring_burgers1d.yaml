# Score Pack — burgers1d_v0 / scoring_v1.0
# Canonical formulas: appendices/Scoring.md
# Generator categories must match poc/generators/stress_categories.py

challenge_id: burgers1d_v0
scoring_version: "1.0"
generator_version_required: "burgers1d_v0.4"
stress_spec_version_required: "burgers_stress_v1"
precision: fp32

weights:
  physics: 0.45
  robustness: 0.30
  accuracy: 0.25

margin:
  type: linear_clip   # m(e, tau) = clip(1 - e/tau, 0, 1)

# Hard gates (binary kill). Soft physics uses the same error keys with continuous margins.
hard_gates:
  - id: finite
    type: no_nan_inf
    error_key: finite_ok   # pass if == 1.0
  - id: conservation
    type: threshold
    error_key: e_cons
    tau: 0.08
  - id: residual_ceiling
    type: threshold
    error_key: e_res
    tau: 2.0
  - id: accuracy_ceiling
    type: threshold
    error_key: e_acc
    tau: 0.95
  - id: loss_signal
    type: strategy_predicate
    # at least one loss enable true — checked in gates.py

physics:
  # alphas sum to 1.0
  components:
    - key: e_res
      alpha: 0.40
      tau: 2.0
      definition: burgers_residual_mean
      notes: "mean |Burgers residual diagnostic| on predicted field (fp32)"
    - key: e_cons
      alpha: 0.30
      tau: 0.08
      definition: periodic_mass_proxy
      notes: "|mean(u_T_pred) - mean(u_0)| periodic mass proxy"
    - key: e_roll
      alpha: 0.30
      tau: 0.50
      definition: stress_rel_l2_proxy
      notes: "Lean plant proxy: mean stress relative L2 (short-horizon envelope hold)"

robustness:
  field_error: relative_l2
  lambda_mean_tail: 0.5
  tail_quantile: 0.9
  beta_coverage_min: 0.6   # 0.6 * mean_c(r_c) + 0.4 * min_c(r_c)
  tau_rob: 0.50
  min_category_coverage: 0.95
  # IDs ⊆ stress_categories.CATEGORIES
  categories:
    - id: extended_envelope
    - id: shock_perturbation
    - id: high_freq_noise
    - id: low_viscosity
    - id: grid_perturbation
    - id: ic_scale

accuracy:
  field_error: relative_l2
  tau_acc: 0.50
  aggregate: mean

card_required_fields:
  - physics_margins
  - robustness_by_category
  - accuracy_eval
  - gate_results
  - scoring_pack_hash
  - scoring_version
  - generator_version

scientific_notes: |
  tau_mass 0.08: untrained periodic fields on O(1) ICs often drift 0.05–0.3;
  trained models stay tighter. tau_residual 2.0: untrained FNO residuals >> 1
  on this envelope. tau_rob/tau_acc 0.50: linear margin maps so excellent vs
  mediocre still separate below the hard accuracy_ceiling 0.95.
  e_roll uses stress mean rel-L2 as lean plant proxy until multi-step rollout
  is wired; product-depth plant remains Specialist Bank PB-ROLL.
