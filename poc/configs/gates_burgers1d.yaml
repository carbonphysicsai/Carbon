# Hard gates for Burgers-1D PoC. Any fail → combined_score = 0.
# Tuned so untrained / disabled-loss strategies fail offline without a validator.

gates:
  finite:
    enabled: true
    # no NaN/Inf in predictions

  conservation:
    enabled: true
    # |mean(u_T) - mean(u_0)| ≤ tau (periodic mass proxy)
    # Random fields on order-1 ICs drift ~0.05–0.3; trained models stay tighter.
    tau_mass: 0.08

  residual_ceiling:
    enabled: true
    # mean |Burgers residual diagnostic| on predicted field
    # Untrained FNO residuals are typically >> 1 on this envelope.
    tau_residual: 2.0

  accuracy_ceiling:
    enabled: true
    # eval relative L2 must be below tau (garbage predictions fail hard)
    tau_rel_l2: 0.95

  loss_signal:
    enabled: true
    # strategy must enable at least one loss term (broken fixture has all false)

  boundary:
    enabled: false  # periodic BC — no boundary gate
