[project]
name = "carbon"
version = "0.9.0"
description = "Discovery and evidence infrastructure for fast physical models"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = []

[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
chain = [
    "bittensor==11.1.0",
]
neuraloperator = [
    "neuraloperator>=2.0,<3",
    "torch>=2.4.0",
]
physicsnemo = [
    "nvidia-physicsnemo>=2.0,<3",
    "torch>=2.4.0",
]

[dependency-groups]
dev = [
    "black==26.5.1",
    "build==1.6.0",
    "pip==26.2.1",
    "pytest==9.1.1",
    "ruff==0.16.3",
    "setuptools==84.0.0",
    "wheel==0.48.0",
]
science-jax = [
    "jax==0.9.0.1",
    "jaxlib==0.9.0.1",
    "numpy==2.3.5",
    "pyyaml==6.0.3",
    "scipy==1.17.0",
]
science-torch = [
    "neuraloperator>=2.0,<3",
    "nvidia-physicsnemo>=2.0,<3",
    "torch>=2.4.0",
    "torchvision>=0.25.0",
]
chain = [
    "bittensor==11.1.0",
]
archive = [
    "cryptography==50.0.1",
    "psycopg[binary]==3.3.5",
]

[tool.uv]
required-version = "==0.12.7"
default-groups = ["dev"]
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.setuptools.packages.find]
where = ["."]
include = ["carbon*"]

[tool.setuptools.package-data]
"carbon.reconstruction._vendor.carbon_jax_lab" = [
    "licenses/*.md",
    "licenses/third_party/*.txt",
]

[tool.pytest.ini_options]
addopts = ["--strict-markers"]
testpaths = ["tests/cpu"]
markers = [
    "invariant: constitutional invariant tests introduced by A12 and later tickets",
]

[tool.black]
target-version = ["py310"]
