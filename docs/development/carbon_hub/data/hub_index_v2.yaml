    summary: "Recorded that GPU reconstruction is not reproducible across processes unless the execution configuration is pinned, and that pinning it makes it reproducible. Measured on the owner's device under the owner's authorization: four unpinned sessions of the same registered strategy under identical R0 identities produced four different weight digests, each session internally bit-identical, while three pinned sessions produced one. Pinning also changes the numbers, and costs about one second of additional compile time. The determinism configuration is pinned in the GPU worker environment with every flag verified against the pinned build rather than recalled, and the artifact record now carries what determines the numerics - effective instruction set, XLA flags, TF32 and cuBLAS controls, and the device facts - under a new artifact schema version, with the previous versions still readable and unchanged in meaning. The validator policy is declared and explicitly not qualified; it delivers same-device reproducibility and does not deliver cross-device agreement, which no setting provides. Gate robustness options are written up and implemented nowhere. No hardware is qualified, no tolerance is set, no threshold changed, and the observation registry stays empty."
