    summary: "Recorded C-CORE-20, which builds the caller that constructs a validator GPU reconstruction. The previous ticket made that role admissible and recorded in its own delivery that nothing constructed one: the repeat path calls reconstruction in process and contains no backend, accelerator, profile or device selection of any kind, so admission was unblocked and unreachable at the same time. The new module is the validator counterpart of the existing miner entry point and uses the same controller, durable queue and launch store rather than a second orchestration system; cancellation and recovery are properties of the host and its launch store rather than of a lane, so both entry points share one implementation and differ only in the label on the record written. Three properties make it a validator entry point rather than a parameterised miner one: the role is a fixed literal because a caller that could choose the role could choose the lane; the execution class is resolved from an operator-installed record on the host and the manifest has no image field at all, so a manifest naming even the correct image is refused by the closed schema rather than by a value comparison; and identity comes from the durable queue, with plan, reconstruction policy and resource policy digests each checked against the committed binding before anything is staged. The in-process reconstruction path is unchanged to the line, because a backend parameter there would be the role laundering the design forbids, and a plan without an accelerator profile presented with an accelerator role is refused and builds nothing rather than reconstructing on the processor under a record saying otherwise. External review found one real defect, fixed here: cancel requests are keyed by execution identity alone so either lane could stop the other's launch, while a docstring implied a boundary the filesystem did not have and no test covered it either way; it is decided as lane-independent exactly as recovery already documents itself, because an execution identity names one admitted execution in one lane and adding the lane to the key would only let a correct cancel silently miss, which is the dangerous failure for a stop whose purpose is halting spend. A symlinked execution-class record is now refused and the host root was verified to be fixed in source rather than configurable by environment. The terminal success path is carried as far as it goes without hardware, leaving one isolated step that genuinely requires a device rather than approximating it. No formal journaled accelerator attempt was consumed and this ticket attached no device, created no container and incurred no spend, which does not erase the earlier determinism work run under separate authorization. Backend comparison, qualification, thresholds, gates, tolerance policy, scoring and rank logic are untouched, protected-material negatives are retained and extended, and the two-host study is specified and not started. Validator GPU orchestration is implemented and engineering-tested; official backend qualification remains unresolved."
    primary_detail: "https://github.com/carbonphysicsai/Carbon/blob/7c6539d8de02f70e7df1b9a9049a55984be7e35e/.agent/evidence/wave_c/c-core-20-validator-orchestration.md"
