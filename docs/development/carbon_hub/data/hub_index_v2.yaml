    summary: "The Launchpad's public research consumer now selects the C-CORE-19 miner lane by its trusted service role instead of loading a strict validator host grant, with no fallback in either direction. Controller storage resolves from the campaign root rather than an operator grant field, and the request identity that carried the grant digest is versioned to bind the per-run installed device record; legacy records stay readable through the existing status, report and export projections and are never replayed, re-charged or relabelled. A grant declaring runtime.gpu_research can now actually be assembled, with shape checked before role generation is charged for and the real scope binding recomputed from the campaign's own public TRAIN material. Research runtime and the independent DEVELOPMENT comparison remain separately described; a GPU research selection neither selects nor rewrites the evaluator, which keeps its CPU route. Strict, validator and official admission are unchanged and their tests untouched. Engineering scope only: no hardware is qualified, no grant is created, no tolerance is set, and C-MLP-02's genuine multi-iteration browser campaign, independent comparison and verified cleanup remain selected and incomplete."
