    event_type: "evidence"
    event_id: "C-CORE-19-ALLOCATION-01"
    owner_lane: "core_platform"
    status: "implemented"
    summary: "Recorded work package N items N1 to N5 for C-CORE-19, and corrected three figures previously published in this ticket's own evidence. The worker rejected any CPU allocation that was not exactly cores 0 and 1, which made two concurrent reconstructions impossible on any host because both demanded the same two cores; the allocation is now resolved from the host through a new host execution module, with both enforcement paths reconciled and the declared envelope unchanged at two CPUs and four gibibytes. That change was licensed by measurement: eighteen runs across nine container configurations - core counts of one, two, four and eight, memory ceilings of two, four and eight gibibytes, and two simultaneous runs on disjoint core sets - produced one weight digest, so sizing is a cost and throughput decision on this evidence rather than a reproducibility one. The compile fixture, which pinned its step count to two in three independent places and is the reason every determinism result to date was measured on two steps, can now express other step counts through an opt-in widening that leaves the default plan digest byte-identical. Widening it immediately overturned an assumption this ticket had recorded as fact: divergence between CPU instruction-set levels does not compound with step count, because although absolute divergence and the share of affected parameters both grow monotonically over two to thirty-two steps, relative divergence does not, and at thirty-two steps the parameter figure is below its two-step value; since the gate margin rule is stated in relative terms, the floor framing was wrong for the rule it supported and the governing prediction figure moves from roughly one part in a million to one part in a hundred thousand. A prediction row that reported eleven of sixty-four differing values beside a magnitude taken from a different instruction-set pair was corrected to a single comparison, and the pinning cost of sixty-three per cent compile time, which had been derived from the most favourable pair of endpoints, was restated as a median of fifty-eight per cent over nine runs per condition while the execution overhead figure was withdrawn entirely because median and mean disagree in sign at that sample size. The validator deployment path is written down for the first time and is complete for CPU reconstruction and scoring, which require no host grant, no exclusivity and no admission ceremony; it is not complete for GPU, because the validator reconstruction role still dispatches through the strict host apparatus that this work package forbids both building on and removing, and that seam is recorded as requiring a new owner decision rather than resolved. Three further device experiments are specified and none is run, with every cost line for the two-host test left as requiring a quote and no comparative cost claim made. No hardware is qualified, no tolerance is set, no threshold changed, and zero of four authorized attempts are consumed."
