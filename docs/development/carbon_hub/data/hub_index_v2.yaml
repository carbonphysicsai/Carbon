    event_type: "decision"
    event_id: "C-CORE-19-ADMISSION-01"
    owner_lane: "owner"
    status: "implemented"
    summary: "Recorded the owner decision of 2026-09-21 that GPU validator reconstruction admits through the installed host record and the read-only readiness report, the same path the miner lane uses, and requires neither an owner-signed grant nor an exclusive device lease. The deployment path had recorded this as the one decision it could not make for itself. The reasoning is that exclusivity was never the mechanism delivering reproducibility: pinning the execution configuration is, measured as three sessions and nine runs producing one weight digest against four unpinned sessions producing four, so a validator holding a device exclusively without that configuration is no better off. The grant it replaced was self-asserted, constraining accident rather than an adversary, and one signed record per host cannot coexist with the provider freedom validators are promised. Both accelerator roles now take the self-service path. The strict apparatus is neither removed nor built upon; it remains in the tree and, because the role enumeration has exactly two values and both now route elsewhere, it is no longer reached through the controller entry point at all, while its own machinery keeps its direct coverage. The two reserved authorities stay never-interchangeable and no third was invented. The lane now follows the role rather than a literal, the validator worker profile takes its own schema version so that every record already written keeps exactly what it asserted, and the validator assurance label states that its standing waits on backend qualification rather than on a downstream reconstruction that does not exist for an arbiter's own run. The numerics record gains device memory pressure and a compute-process count under a new version, with the previous version still readable, and separates an observed absence from a host that could not be asked, so declining to require exclusivity does not become a claim that contention is harmless. Admission is not qualification: comparison still reports the backend unsupported while no backend profile is qualified, that gate remains owned by science and reliability engineering, no hardware is qualified, no tolerance is set, no threshold changed, no attempt was spent and the observation registry stays empty. One bounded gap is recorded rather than closed: no shipped caller constructs the validator role, so admission is unblocked while the orchestration that would drive it remains separate work."
