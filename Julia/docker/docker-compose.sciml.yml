# docker-compose.sciml.yml
version: '3.8'
services:
  sciml-service:
    build:
      context: ./julia
      dockerfile: docker/Dockerfile.sciml
    container_name: carbon-sciml
    ports:
      - "8083:8083"
    environment:
      - JULIA_NUM_THREADS=16
      - JULIA_DEPOT_PATH=/opt/julia/depot
    volumes:
      - sciml-depot:/opt/julia/depot
      - ./julia:/app
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  sciml-depot:
