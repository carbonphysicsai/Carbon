name: Delivery maintenance snapshot

on:
  push:
    branches: [owner/streamline-delivery-20260906]
    paths: [.github/workflows/delivery-maintenance-snapshot.yml]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Export public source history for isolated maintenance testing
        run: |
          set -euo pipefail
          git bundle create "${RUNNER_TEMP}/carbon-delivery-source.bundle" HEAD
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: carbon-delivery-source
          path: ${{ runner.temp }}/carbon-delivery-source.bundle
          retention-days: 1
          if-no-files-found: error
