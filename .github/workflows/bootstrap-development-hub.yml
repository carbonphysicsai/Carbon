name: Bootstrap Development Hub

on:
  push:
    branches:
      - docs/carbon-development-hub-v2

permissions:
  contents: write

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out bootstrap branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: docs/carbon-development-hub-v2
          fetch-depth: 0

      - name: Extract the Development Hub package
        run: |
          python3 - <<'PY'
          import base64
          import pathlib
          import re

          output = pathlib.Path('/tmp/carbon-development-hub.tgz')
          output.write_bytes(b'')
          allowed = re.compile(rb'^[A-Za-z0-9+/]*={0,2}$')

          with output.open('ab') as destination:
              for part in sorted(pathlib.Path('.agent/hub_bootstrap_b64').glob('part-*')):
                  compact = b''.join(part.read_bytes().split())
                  print(f'{part}: {len(compact)} base64 bytes, remainder {len(compact) % 4}')
                  if not allowed.fullmatch(compact):
                      bad = sorted(set(compact) - set(b'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/='))
                      raise SystemExit(f'invalid characters in {part}: {bad}')
                  try:
                      decoded = base64.b64decode(compact, validate=True)
                  except Exception as exc:
                      raise SystemExit(f'cannot decode {part}: {exc}') from exc
                  destination.write(decoded)
          PY
          echo "5fb829b614952f5236af6c6f095b7a4f87109c1dd2ff033cf35cd83e54f8351e  /tmp/carbon-development-hub.tgz" | sha256sum --check -
          tar -xzf /tmp/carbon-development-hub.tgz

      - name: Make the static-first hub self-contained
        run: |
          python3 - <<'PY'
          from pathlib import Path

          renderer = Path('docs/development_hub/tools/render_hub.py')
          text = renderer.read_text(encoding='utf-8')
          text = text.replace(
              '<a class="button primary" href="#routes">Place a protocol change</a><a class="button" href="interactive.html">Optional app view</a>',
              '<a class="button primary" href="#routes">Place a protocol change</a>',
          )
          text = text.replace(
              'Open **`index.html`** first. It is static-first and remains readable when a preview blocks JavaScript. `interactive.html` is an optional app view.',
              'Open **`index.html`** first. It contains the complete hub and remains readable when a preview blocks JavaScript.',
          )
          renderer.write_text(text, encoding='utf-8')

          route_test = Path('docs/development_hub/tools/test_routes.js')
          route_test.write_text(r'''#!/usr/bin/env node
/* Browser-free smoke test for the static-first Carbon Development Hub. */
const fs = require('fs');
const path = require('path');

const root = path.resolve(__dirname, '..');
const html = fs.readFileSync(path.join(root, 'index.html'), 'utf8');
const checks = {
  'home': 'Understand what is changing and why.',
  'start': 'New to Carbon',
  'waves': 'Waves A through N',
  'wave-b': 'Wave B: Science-ready authoring skeletons',
  'tickets': 'Ticket index',
  'ticket-b-03': 'B-03',
  'routes': 'Place a change before implementing it',
  'change-new-challenge': 'Add a new Challenge',
  'change-model-architecture': 'Add or change a model architecture',
  'change-miner-prior': 'Add or change a miner prior',
  'maturity': 'Eight independent maturity states',
  'glossary': 'Carbon terms in plain language',
  'sources': 'Authority and sources'
};
let failures = 0;
for (const [id, expected] of Object.entries(checks)) {
  const idPattern = new RegExp(`id=["']${id}["']`);
  if (!idPattern.test(html) || !html.includes(expected)) {
    console.error(`FAIL #${id}: missing anchor or text ${expected}`);
    failures += 1;
  } else {
    console.log(`PASS #${id}`);
  }
}
if (/<script\b/i.test(html)) {
  console.error('FAIL index.html: primary hub must not require scripts');
  failures += 1;
}
if (failures) process.exit(1);
console.log(`Static hub route smoke test passed: ${Object.keys(checks).length} anchors.`);
''', encoding='utf-8')
          PY

      - name: Apply repository policy integration
        run: python3 repo_integration/bootstrap/install_repo.py

      - name: Generate and validate the hub
        run: |
          python3 docs/development_hub/tools/render_hub.py
          python3 docs/development_hub/tools/render_hub.py --check
          python3 docs/development_hub/tools/validate_hub.py --repo-root .
          node docs/development_hub/tools/test_routes.js

      - name: Commit the installed hub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: install Carbon Development Hub v2"
          git push origin HEAD:docs/carbon-development-hub-v2
