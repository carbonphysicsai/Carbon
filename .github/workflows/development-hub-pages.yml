name: Publish Development Hub

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - docs/development/carbon_hub/**

permissions:
  contents: read

concurrency:
  group: development-hub-pages
  cancel-in-progress: false

jobs:
  publish:
    name: Publish owner-approved public static hub
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.CARBON_HUB_PUBLISH == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout exact main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate static publication payload
        run: |
          python3 docs/development/carbon_hub/tools/render_hub.py --check
          python3 docs/development/carbon_hub/tools/validate_hub.py --repo-root . --skip-pr-contract

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload hub artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/development/carbon_hub

      - name: Deploy public Pages site
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
