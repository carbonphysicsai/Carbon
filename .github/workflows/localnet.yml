name: Disposable localnet evidence

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Image discovery, one registration diagnostic, full NET-5, or NET-6 operator lane'
        type: choice
        options: [inspect, diagnostic, full, operator]
        default: full
      profile:
        description: 'Exact runtime profile registered in the pinned image manifest'
        type: choice
        options: [standard, fast]
        default: standard

permissions:
  contents: read

concurrency:
  group: disposable-localnet-${{ github.ref }}
  cancel-in-progress: false

jobs:
  localnet:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - name: Check out exact requested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.12.7"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Bootstrap Carbon development environment
        env:
          CARBON_UV_GROUPS: chain
        run: ./scripts/dev/bootstrap.sh
      - name: Validate local fixture and installed SDK setup contracts
        env:
          CARBON_UV_GROUPS: chain
          CARBON_REQUIRE_CHAIN_SDK: "1"
        run: .venv/bin/python -m pytest tests/cpu/test_net5_setup.py tests/cpu/test_net6_operations.py -q
      - name: Execute disposable runtime and collect actual evidence
        env:
          CARBON_UV_GROUPS: chain
          CARBON_LOCALNET_MODE: ${{ inputs.mode }}
          CARBON_LOCALNET_PROFILE: ${{ inputs.profile }}
        run: ./scripts/dev/localnet.sh .carbon-artifacts/localnet
      - name: Preserve runtime diagnostics, including failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: disposable-localnet-${{ inputs.profile }}-${{ inputs.mode }}-${{ github.sha }}
          path: .carbon-artifacts/localnet
          if-no-files-found: warn
          retention-days: 14
