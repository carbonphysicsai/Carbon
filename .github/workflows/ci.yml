name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Code quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install supported development environment
        run: python -m pip install -e ".[dev]"
      - name: Enforce no-new-debt quality ratchet
        env:
          QUALITY_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: >-
          python scripts/check_quality.py
          --baseline .ci/quality-baseline.json
          --base "$QUALITY_BASE_SHA"
          --report "$RUNNER_TEMP/carbon-quality/current.json"
      - name: Upload full quality inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-inventory
          path: ${{ runner.temp }}/carbon-quality/current.json
          if-no-files-found: warn

  test:
    name: CPU tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install supported development environment
        run: python -m pip install -e ".[dev]"
      - name: Run default CPU tests
        run: python -m pytest -q

  invariant:
    name: Invariant suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install supported development environment
        run: python -m pip install -e ".[dev]"
      - name: Run invariant suite
        run: python -m pytest tests/invariants -m invariant -q

  test-fno-parity:
    name: FNO neuraloperator parity tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install JAX/Flax and PyTorch/neuraloperator stacks
        run: python -m pip install -e ".[dev,poc,neuraloperator]"
      - name: Run FNO neuraloperator parity tests
        run: python -m pytest -q tests/cpu/test_fno_neuralop_parity.py

