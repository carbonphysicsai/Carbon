name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  canonical:
    name: Canonical environment
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Install pinned uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.7"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Bootstrap locked Carbon environment
        run: ./scripts/dev/bootstrap.sh

      - name: Run canonical local/CI command
        env:
          QUALITY_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CARBON_ARTIFACT_DIR: .carbon-artifacts
        run: ./scripts/dev/ci.sh

      - name: Upload quality inventory
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quality-inventory
          path: .carbon-artifacts/quality.json
          if-no-files-found: warn

  dev-image:
    name: Clean dev-container image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARBON_DEV_IMAGE: carbon-dev:${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Build pinned Carbon development image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: .devcontainer/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          no-cache: true
          pull: true
          tags: ${{ env.CARBON_DEV_IMAGE }}

      - name: Start image and run canonical acceptance
        env:
          QUALITY_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: ./scripts/dev/verify_image.sh "${CARBON_DEV_IMAGE}"

  fno-parity:
    name: FNO neuraloperator parity tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARBON_UV_GROUPS: "science-jax science-torch"
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Install pinned uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.7"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Bootstrap locked Carbon environment with the JAX and PyTorch backend groups
        run: ./scripts/dev/bootstrap.sh

      - name: Run FNO neuraloperator parity tests
        run: ./scripts/dev/test.sh tests/cpu/test_fno_neuralop_parity.py

