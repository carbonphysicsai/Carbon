name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  preflight:
    name: Delivery preflight
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      candidate_sha: ${{ steps.candidate.outputs.candidate_sha }}
      base_sha: ${{ steps.candidate.outputs.base_sha }}
      change_scope: ${{ steps.delivery.outputs.change_scope }}
      dev_image_required: ${{ steps.delivery.outputs.dev_image_required }}
      c03_worker_required: ${{ steps.delivery.outputs.c03_worker_required }}
      workbench_required: ${{ steps.delivery.outputs.workbench_required }}
    steps:
      - name: Resolve the current exact candidate
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_REF: ${{ github.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            endpoint="repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}"
            candidate_sha="$(gh api "${endpoint}" --jq .head.sha)"
            base_sha="$(gh api "${endpoint}" --jq .base.sha)"
            [[ "${EVENT_PR_HEAD}" =~ ^[0-9a-f]{40}$ ]]
            if [[ "${candidate_sha}" != "${EVENT_PR_HEAD}" ]]; then
              echo "Historical event head ${EVENT_PR_HEAD} no longer equals live head ${candidate_sha}; use the current event run." >&2
              exit 2
            fi
          elif [[ "${EVENT_NAME}" == "push" && "${EVENT_REF}" == "refs/heads/main" ]]; then
            candidate_sha="${EVENT_SHA}"
            base_sha="${EVENT_BEFORE}"
          else
            echo "Unsupported event/ref: ${EVENT_NAME} ${EVENT_REF}" >&2
            exit 2
          fi
          [[ "${candidate_sha}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${base_sha}" =~ ^[0-9a-f]{40}$ ]]
          printf 'candidate_sha=%s\nbase_sha=%s\n' "${candidate_sha}" "${base_sha}" >> "${GITHUB_OUTPUT}"

      - name: Check out current exact candidate with history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.candidate.outputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Classify and run delivery preflight
        id: delivery
        env:
          QUALITY_BASE_SHA: ${{ steps.candidate.outputs.base_sha }}
          CARBON_CANDIDATE_SHA: ${{ steps.candidate.outputs.candidate_sha }}
          CARBON_EVENT_NAME: ${{ github.event_name }}
          CARBON_EVENT_REF: ${{ github.ref }}
          CARBON_EVENT_SHA: ${{ github.sha }}
        run: ./scripts/dev/ci_preflight.sh


  canonical:
    name: Canonical environment
    if: needs.preflight.outputs.change_scope == 'RUNTIME_FULL'
    needs: preflight
    runs-on: ubuntu-24.04
    # The full canonical lane took 53 of 60 minutes before the battery JAX
    # suites; they need more than the remaining headroom. A time limit is not
    # a test, so raising it drops no coverage.
    timeout-minutes: 90
    steps:
      - name: Check out exact classified candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Run bounded public Ask Carbon acceptance
        run: |
          npm test --prefix website/ask-carbon
          npm run validate --prefix website/ask-carbon
      - name: Install pinned uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.7"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Bootstrap locked Carbon environment
        env:
          CARBON_UV_GROUPS: "chain archive science-jax mcp"
        run: ./scripts/dev/bootstrap.sh
      - name: Install pinned independent MCP client runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.19.0"
      - name: Install locked independent MCP client
        run: |
          npm install --global pnpm@11.19.0 --ignore-scripts
          pnpm --dir tests/service/mcp_typescript install --frozen-lockfile --ignore-scripts
      - name: Run canonical local/CI command
        env:
          CARBON_UV_GROUPS: "chain archive science-jax mcp"
          CARBON_REQUIRE_CHAIN_SDK: "1"
          CARBON_REQUIRE_TYPESCRIPT_INTEROP: "1"
          QUALITY_BASE_SHA: ${{ needs.preflight.outputs.base_sha }}
          CARBON_ARTIFACT_DIR: .carbon-artifacts
          # Ubuntu runners provide Docker; make wrapper integration fail instead
          # of silently skipping when that required service is unavailable.
          CARBON_REQUIRE_DOCKER_TESTS: "1"
        run: ./scripts/dev/ci.sh
      - name: Upload quality inventory
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quality-inventory
          path: .carbon-artifacts/quality.json
          if-no-files-found: warn

  dev-image:
    name: Clean dev-container image
    if: needs.preflight.outputs.change_scope == 'RUNTIME_FULL' && needs.preflight.outputs.dev_image_required == 'true'
    needs: preflight
    runs-on: ubuntu-24.04
    # Runs the same canonical acceptance inside the image (see canonical).
    timeout-minutes: 90
    env:
      CARBON_DEV_IMAGE: carbon-dev:${{ needs.preflight.outputs.candidate_sha }}
      CARBON_UV_GROUPS: "chain archive science-jax mcp"
    steps:
      - name: Check out exact classified candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Build pinned Carbon development image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: .devcontainer/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          no-cache: true
          pull: true
          tags: ${{ env.CARBON_DEV_IMAGE }}
      - name: Start image and run canonical acceptance
        env:
          QUALITY_BASE_SHA: ${{ needs.preflight.outputs.base_sha }}
        run: ./scripts/dev/verify_image.sh "${CARBON_DEV_IMAGE}"

  c03-worker:
    name: C-03/C-04/C-05/C-07/C-08/C-10 isolated service acceptance
    if: needs.preflight.outputs.change_scope == 'RUNTIME_FULL' && needs.preflight.outputs.c03_worker_required == 'true'
    needs: preflight
    runs-on: ubuntu-24.04
    # The authored-Julia service suite builds and precompiles both pinned SciML
    # environments from empty caches, after ~35 minutes of C-03 controls.
    timeout-minutes: 120
    steps:
      - name: Check out exact classified candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.7"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Bootstrap locked controller environment
        env:
          CARBON_UV_GROUPS: "chain archive science-jax mcp"
        run: ./scripts/dev/bootstrap.sh
      - name: Build exact worker image and manifest
        run: ./scripts/dev/c03_worker_image.sh
      - name: Run required service-backed controls and real numerical paths
        run: ./scripts/dev/c03_worker_service.sh
      - name: Build pinned native Julia reference worker
        run: bash ./scripts/dev/julia_worker_image.sh
      - name: Install pinned Node for the Workbench private build
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.19.0"
      - name: Exercise registered Julia study and observed cancellation cleanup
        env:
          CARBON_JULIA_WORKER_MANIFEST: .carbon-artifacts/julia-worker-image.json
          CARBON_JULIA_TRACE_PATH: .carbon-artifacts/julia-service-traces.jsonl
        run: bash ./scripts/dev/julia_worker_service.sh
      - name: Exercise the three retained owner commands
        run: |
          ./scripts/dev/c03_worker.sh doctor
          ./scripts/dev/c03_worker.sh smoke
          ./scripts/dev/c03_worker.sh reconcile
      - name: Upload exact C-03 image and service evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: c03-worker-evidence
          path: |
            .carbon-artifacts/c03-worker-image.json
            .carbon-artifacts/c03-service-junit.xml
            .carbon-artifacts/c03-service-traces.jsonl
            .carbon-artifacts/julia-worker-image.json
            .carbon-artifacts/julia-service-traces.jsonl
          if-no-files-found: error

  workbench:
    name: Workbench release and application acceptance
    if: needs.preflight.outputs.workbench_required == 'true'
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact classified candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.7"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Bootstrap locked Carbon environment
        run: ./scripts/dev/bootstrap.sh
      - name: Install pinned Workbench Node runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.19.0"
      - name: Run required Workbench release and application checks
        run: ./scripts/dev/workbench_release_checks.sh

  contract-authority:
    name: Contract and authority acceptance
    if: needs.preflight.outputs.change_scope == 'CONTRACT_AUTHORITY'
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact classified candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.7"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Bootstrap locked Carbon environment
        env:
          CARBON_UV_GROUPS: "archive"
        run: ./scripts/dev/bootstrap.sh
      - name: Run contract-authority acceptance
        env:
          QUALITY_BASE_SHA: ${{ needs.preflight.outputs.base_sha }}
        run: ./scripts/dev/ci_contract_authority.sh

  hub-validation:
    name: Development Hub validation
    if: needs.preflight.outputs.change_scope != 'DERIVED_DOCUMENTATION'
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact classified candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Refresh current live pull-request metadata
        if: github.event_name == 'pull_request'
        id: live-pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          live_path="${RUNNER_TEMP}/carbon-live-pr.json"
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" > "${live_path}"
          printf 'path=%s\nrequired=true\n' "${live_path}" >> "${GITHUB_OUTPUT}"
      - name: Run exact-head Hub acceptance
        env:
          HUB_DIFF_BASE_SHA: ${{ needs.preflight.outputs.base_sha }}
          HUB_EXPECTED_CHANGE_SCOPE: ${{ needs.preflight.outputs.change_scope }}
          HUB_LIVE_PR_PATH: ${{ steps.live-pr.outputs.path }}
          HUB_REQUIRE_LIVE_PR: ${{ steps.live-pr.outputs.required }}
        run: ./scripts/dev/ci_hub.sh

  derived-documentation:
    name: Derived documentation acceptance
    if: needs.preflight.outputs.change_scope == 'DERIVED_DOCUMENTATION'
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact classified candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Refresh current live pull-request metadata
        if: github.event_name == 'pull_request'
        id: live-pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          live_path="${RUNNER_TEMP}/carbon-live-pr.json"
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" > "${live_path}"
          printf 'path=%s\nrequired=true\n' "${live_path}" >> "${GITHUB_OUTPUT}"
      - name: Run derived-documentation acceptance
        env:
          HUB_DIFF_BASE_SHA: ${{ needs.preflight.outputs.base_sha }}
          HUB_EXPECTED_CHANGE_SCOPE: ${{ needs.preflight.outputs.change_scope }}
          HUB_LIVE_PR_PATH: ${{ steps.live-pr.outputs.path }}
          HUB_REQUIRE_LIVE_PR: ${{ steps.live-pr.outputs.required }}
        run: ./scripts/dev/ci_derived_documentation.sh

  merge-gate:
    name: Merge gate
    if: always() && github.event.pull_request.draft == false
    needs: [preflight, canonical, dev-image, c03-worker, workbench, contract-authority, hub-validation, derived-documentation]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Repository-local trust hardening: execute the protected base's gate and
      # classifier implementations over an exact candidate checkout. The
      # workflow YAML and reported job results remain candidate-controlled;
      # eliminating that trust requires external/default-branch infrastructure.
      - name: Check out exact protected-base gate and classifier implementations
        if: needs.preflight.outputs.base_sha != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.base_sha }}
          fetch-depth: 1
          persist-credentials: false
          path: .carbon-gate-base
      - name: Check out the exact candidate scope input with history
        if: needs.preflight.outputs.candidate_sha != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false
          path: .carbon-gate-candidate
      - name: Require every classified acceptance job
        env:
          BASE_SHA: ${{ needs.preflight.outputs.base_sha }}
          CANDIDATE_SHA: ${{ needs.preflight.outputs.candidate_sha }}
          PREFLIGHT_SCOPE: ${{ needs.preflight.outputs.change_scope }}
          PREFLIGHT_IMAGE: ${{ needs.preflight.outputs.dev_image_required }}
          PREFLIGHT_C03: ${{ needs.preflight.outputs.c03_worker_required }}
          PREFLIGHT_WORKBENCH: ${{ needs.preflight.outputs.workbench_required }}
          BOOTSTRAP_BASE_SHA: a20d9eece054e7f8b02538527221f6aea022aade
        run: |
          set -euo pipefail
          [[ "${BASE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${CANDIDATE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          actual_candidate="$(git -C .carbon-gate-candidate rev-parse --verify HEAD^{commit})"
          [[ "${actual_candidate}" == "${CANDIDATE_SHA}" ]]

          gate=.carbon-gate-base/scripts/dev/check_merge_gate.py
          classifier=.carbon-gate-base/scripts/dev/classify_changes.py
          if [[ -f "${gate}" && -f "${classifier}" ]]; then
            actual_base="$(git -C .carbon-gate-base rev-parse --verify HEAD^{commit})"
            [[ "${actual_base}" == "${BASE_SHA}" ]]
            echo "Using exact protected-base Merge gate implementation."
            echo "Using exact protected-base change classifier."
          elif [[ "${BASE_SHA}" == "${BOOTSTRAP_BASE_SHA}" && -f .carbon-gate-candidate/scripts/dev/check_merge_gate.py && -f .carbon-gate-candidate/scripts/dev/classify_changes.py ]]; then
            gate=.carbon-gate-candidate/scripts/dev/check_merge_gate.py
            classifier=.carbon-gate-candidate/scripts/dev/classify_changes.py
            echo "Using the one-time B-01F bootstrap Merge gate implementation."
            echo "Using the one-time B-01F bootstrap change classifier."
          else
            echo "No protected-base gate/classifier pair is available for base ${BASE_SHA:-missing}." >&2
            exit 2
          fi

          # OWNER-CW1-DEVELOPMENT-CI-01 BEGIN
          # Read this before deriving a constraint from the digests below.
          # This block is conditional on one historical base commit, so for every
          # current base it does not execute and the digests are never checked.
          # They are kept truthful as hygiene, not because they are the
          # protection: a stale pin would fail a PR that rebased onto that base
          # for reasons unrelated to its content.
          # The actual protection against a pull request reclassifying itself is
          # the comparison further down, where the scope derived from the
          # protected BASE classifier must equal the scope preflight derived from
          # the CANDIDATE classifier. A change to the classifier therefore has to
          # avoid touching any path the two versions would score differently.
          if [[ "${BASE_SHA}" == "d1d07bb408a2b68efed70baf7e11ec22bb180c9d" ]]; then
            printf '%s\n' "7718c70b39bfc269bafe7e308243a866a9184095a36d8dfa551ab5161a187c0e  .carbon-gate-candidate/scripts/dev/classify_changes.py" | sha256sum --check --strict
            printf '%s\n' "8f061b9f5f7ce705d8824358ef34d38e1578b17c5965b088fa81e945ce2b987a  .carbon-gate-candidate/scripts/dev/development_scope.py" | sha256sum --check --strict
            classifier=.carbon-gate-candidate/scripts/dev/classify_changes.py
            echo "Using owner-authorized exact DEVELOPMENT classifier migration; protected-base Merge gate retained."
          fi
          # OWNER-CW1-DEVELOPMENT-CI-01 END

          scope_output="${RUNNER_TEMP}/carbon-gate-scope.txt"
          : > "${scope_output}"
          python3 "${classifier}" \
            --repository .carbon-gate-candidate \
            --base "${BASE_SHA}" \
            --github-output "${scope_output}"
          derived_scope=
          derived_image=
          while IFS='=' read -r key value; do
            if [[ "${key}" == "change_scope" ]]; then
              [[ -z "${derived_scope}" ]] || { echo "Duplicate derived change scope." >&2; exit 2; }
              derived_scope="${value}"
            elif [[ "${key}" == "dev_image_required" ]]; then
              [[ -z "${derived_image}" ]] || { echo "Duplicate image requirement." >&2; exit 2; }
              derived_image="${value}"
            fi
          done < "${scope_output}"
          case "${derived_scope}" in
            RUNTIME_FULL|CONTRACT_AUTHORITY|DERIVED_DOCUMENTATION) ;;
            *) echo "Protected classifier returned invalid scope: ${derived_scope:-missing}." >&2; exit 2 ;;
          esac
          if [[ "${derived_scope}" != "${PREFLIGHT_SCOPE}" ]]; then
            echo "Preflight scope ${PREFLIGHT_SCOPE:-missing} disagrees with protected scope ${derived_scope}." >&2
            exit 2
          fi
          # Older protected bases require the image for all runtime changes.
          # The migration itself changes CI, so it still runs image acceptance.
          if [[ -z "${derived_image}" ]]; then
            if [[ "${derived_scope}" == "RUNTIME_FULL" ]]; then
              derived_image=true
            else
              derived_image=false
            fi
          fi
          [[ "${derived_image}" == true || "${derived_image}" == false ]]
          [[ "${PREFLIGHT_IMAGE}" == "${derived_image}" ]]
          candidate_scope_output="${RUNNER_TEMP}/carbon-gate-candidate-scope.txt"
          : > "${candidate_scope_output}"
          python3 .carbon-gate-candidate/scripts/dev/classify_changes.py \
            --repository .carbon-gate-candidate \
            --base "${BASE_SHA}" \
            --github-output "${candidate_scope_output}"
          derived_c03=
          while IFS='=' read -r key value; do
            if [[ "${key}" == "c03_worker_required" ]]; then
              [[ -z "${derived_c03}" ]] || { echo "Duplicate C-03 worker requirement." >&2; exit 2; }
              derived_c03="${value}"
            fi
          done < "${candidate_scope_output}"
          [[ "${derived_c03}" == true || "${derived_c03}" == false ]]
          [[ "${PREFLIGHT_C03}" == "${derived_c03}" ]]
          if [[ "${derived_c03}" == true ]]; then
            [[ "${{ needs.c03-worker.result }}" == success ]] \
              || { echo "C-03 worker service acceptance did not succeed." >&2; exit 1; }
          else
            [[ "${{ needs.c03-worker.result }}" == skipped ]] \
              || { echo "Unexpected C-03 worker service result." >&2; exit 1; }
          fi
          # Derived from the candidate's own module. classify_changes.py and
          # development_scope.py stay byte-identical to their owner-pinned
          # digests, so this requirement cannot re-authorise that migration.
          workbench_result="${{ needs.workbench.result }}"
          # WORKBENCH-REQUIREMENT BEGIN
          # Derived from the candidate's own module. classify_changes.py and
          # development_scope.py stay byte-identical to their owner-pinned
          # digests, so this requirement cannot re-authorise that migration.
          derived_workbench=
          workbench_scope=.carbon-gate-candidate/scripts/dev/workbench_scope.py
          if [[ -f "${workbench_scope}" ]]; then
            workbench_output="${RUNNER_TEMP}/carbon-gate-workbench.txt"
            : > "${workbench_output}"
            python3 "${workbench_scope}"               --repository .carbon-gate-candidate               --base "${BASE_SHA}"               --github-output "${workbench_output}"
            workbench_seen=0
            # Record presence is tracked separately from the value: keying the
            # duplicate check on an empty value would let an empty first record
            # wave a second one through. The trailing clause processes a final
            # line written without a newline instead of dropping it.
            while IFS='=' read -r key value || [[ -n "${key}" ]]; do
              if [[ "${key}" == "workbench_required" ]]; then
                (( workbench_seen == 0 )) || { echo "Duplicate Workbench requirement." >&2; exit 2; }
                workbench_seen=1
                derived_workbench="${value}"
              fi
            done < "${workbench_output}"
            # A present module must reach an explicit decision. Treating a
            # missing, empty or malformed emission as "not required" would let a
            # broken scope module silently disable the job it exists to demand.
            (( workbench_seen == 1 ))               || { echo "Workbench scope module produced no explicit requirement." >&2; exit 2; }
            [[ "${derived_workbench}" == true || "${derived_workbench}" == false ]]               || { echo "Workbench scope module produced no explicit requirement." >&2; exit 2; }
            [[ "${PREFLIGHT_WORKBENCH:-}" == true || "${PREFLIGHT_WORKBENCH:-}" == false ]]               || { echo "Preflight produced no explicit Workbench requirement." >&2; exit 2; }
            [[ "${PREFLIGHT_WORKBENCH}" == "${derived_workbench}" ]]               || { echo "Preflight and protected Workbench requirements disagree." >&2; exit 2; }
          else
            # Only a candidate that genuinely predates the module may omit it.
            derived_workbench=false
            [[ -z "${PREFLIGHT_WORKBENCH:-}" || "${PREFLIGHT_WORKBENCH:-}" == false ]]               || { echo "Preflight required the Workbench job but the candidate has no scope module." >&2; exit 2; }
          fi
          if [[ "${derived_workbench}" == true ]]; then
            [[ "${workbench_result}" == success ]] || { echo "Workbench release acceptance did not succeed." >&2; exit 1; }
          else
            [[ "${workbench_result}" == skipped ]] || { echo "Unexpected Workbench release acceptance result." >&2; exit 1; }
          fi
          # WORKBENCH-REQUIREMENT END
          image_args=()
          if [[ "${derived_scope}" == "RUNTIME_FULL" && "${derived_image}" == false ]]; then
            image_args=(--dev-image-required false)
          fi
          python3 "${gate}" "${image_args[@]}" \
            --scope "${derived_scope}" \
            --preflight "${{ needs.preflight.result }}" \
            --canonical "${{ needs.canonical.result }}" \
            --dev-image "${{ needs.dev-image.result }}" \
            --contract-authority "${{ needs.contract-authority.result }}" \
            --hub-validation "${{ needs.hub-validation.result }}" \
            --derived-documentation "${{ needs.derived-documentation.result }}"
