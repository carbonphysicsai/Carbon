name: Format Development Hub tools

on:
  push:
    branches:
      - docs/carbon-development-hub-v2

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out hub branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: docs/carbon-development-hub-v2
          fetch-depth: 0

      - name: Install pinned uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.7"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Bootstrap locked Carbon environment
        run: ./scripts/dev/bootstrap.sh

      - name: Narrow expected exception handling
        run: |
          python3 - <<'PY'
          from pathlib import Path

          browser = Path('docs/development_hub/tools/browser_smoke_test.py')
          text = browser.read_text(encoding='utf-8')
          text = text.replace(
              'from playwright.sync_api import sync_playwright',
              'from playwright.sync_api import Error as PlaywrightError, sync_playwright',
          )
          text = text.replace(
              'except Exception as exc:\n            print(f"SKIP: Chromium could not launch: {exc}")',
              'except PlaywrightError as exc:\n            print(f"SKIP: Chromium could not launch: {exc}")',
          )
          browser.write_text(text, encoding='utf-8')

          validator = Path('docs/development_hub/tools/validate_hub.py')
          text = validator.read_text(encoding='utf-8')
          replacements = {
              'except Exception as exc:\n        fail(f"JSON parse failed for {data_path.name}: {exc}")':
                  'except (OSError, json.JSONDecodeError) as exc:\n        fail(f"JSON parse failed for {data_path.name}: {exc}")',
              'except Exception as exc:\n        fail(f"JSON parse failed for {events_path.name}: {exc}")':
                  'except (OSError, json.JSONDecodeError) as exc:\n        fail(f"JSON parse failed for {events_path.name}: {exc}")',
              'except Exception as exc:\n        fail(f"YAML index read failed: {exc}")':
                  'except OSError as exc:\n        fail(f"YAML index read failed: {exc}")',
              'except Exception as exc:\n            fail(f"{html_path.relative_to(HUB_ROOT)} HTML parse failed: {exc}")':
                  'except (AssertionError, ValueError) as exc:\n            fail(f"{html_path.relative_to(HUB_ROOT)} HTML parse failed: {exc}")',
              'except Exception as exc:\n                fail(f"interactive.html embedded DATA parse failed: {exc}")':
                  'except json.JSONDecodeError as exc:\n                fail(f"interactive.html embedded DATA parse failed: {exc}")',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Expected exception block was not found: {old!r}')
              text = text.replace(old, new, 1)
          validator.write_text(text, encoding='utf-8')
          PY

      - name: Apply repository formatters
        run: |
          uv run ruff check --fix docs/development_hub/tools/*.py
          uv run black docs/development_hub/tools/*.py
          uv run ruff check docs/development_hub/tools/*.py
          uv run black --check docs/development_hub/tools/*.py

      - name: Commit formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/development_hub/tools/*.py
          if git diff --cached --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git commit -m "style: format Development Hub maintenance tools"
          git push origin HEAD:docs/carbon-development-hub-v2
