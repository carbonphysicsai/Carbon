name: One-time Development Hub whitespace repair

on:
  push:
    branches:
      - docs/carbon-development-hub-v2

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact hub branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: docs/carbon-development-hub-v2
          fetch-depth: 0

      - name: Replace Markdown hard-break spaces with explicit breaks
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('docs/development_hub/tools/render_hub.py')
          text = path.read_text(encoding='utf-8')
          replacements = {
              "**Status:** {wave['status'].upper()}  \n**Purpose:":
                  "**Status:** {wave['status'].upper()}<br>\n**Purpose:",
              "**Wave:** {ticket['wave']}  \n**Status:** {ticket['status'].upper()}  \n**Target phase:":
                  "**Wave:** {ticket['wave']}<br>\n**Status:** {ticket['status'].upper()}<br>\n**Target phase:",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Expected renderer block was not found: {old!r}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Regenerate and validate
        run: |
          python3 docs/development_hub/tools/render_hub.py
          python3 docs/development_hub/tools/render_hub.py --check
          python3 docs/development_hub/tools/validate_hub.py --repo-root .
          node docs/development_hub/tools/test_routes.js
          git diff --check

      - name: Commit exact repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/development_hub
          git commit -m "fix: remove Development Hub trailing whitespace"
          git push origin HEAD:docs/carbon-development-hub-v2
