version: '3.8'

services:
  validator:
    build:
      context: .
      dockerfile: docker/validator/Dockerfile
    image: carbon-validator:latest
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    volumes:
      - .:/app
    command: python3 -m neurons.validator

  miner:
    build:
      context: .
      dockerfile: docker/miner/Dockerfile
    image: carbon-miner:latest
    volumes:
      - .:/app
    environment:
      - CARBON_HOTKEY=${CARBON_HOTKEY:-}
      - CARBON_WALLET=${CARBON_WALLET:-}
      - CARBON_API_KEY=${CARBON_API_KEY:-}
      - CHALLENGE_ID=${CHALLENGE_ID:-}
      - DRY_RUN=${DRY_RUN:-false}
      - ITERATIONS=${ITERATIONS:-8}
      - SUBMIT_THRESHOLD=${SUBMIT_THRESHOLD:-0.075}
      - USE_REAL_CLIENT=${USE_REAL_CLIENT:-false}
    command: python examples/run_agentic_miner.py
