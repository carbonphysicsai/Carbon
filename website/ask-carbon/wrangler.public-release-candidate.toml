name = "ask-carbon-public"
account_id = "7462053c6992b9c9fd889952a7ae0496"
main = "worker/index.mjs"
compatibility_date = "2026-09-16"
workers_dev = false
preview_urls = false

# Candidate only. Do not deploy until the owner approves the exact release
# package. These path routes preserve the existing carbonwebsite homepage.
[[routes]]
pattern = "carbonphysics.ai/api/ask-carbon*"
zone_name = "carbonphysics.ai"

[[routes]]
pattern = "www.carbonphysics.ai/api/ask-carbon*"
zone_name = "carbonphysics.ai"

[[durable_objects.bindings]]
name = "ASK_CARBON_USAGE_LEDGER"
class_name = "AskCarbonUsageLedger"
script_name = "ask-carbon-budget-authority"

[[ratelimits]]
name = "ASK_CARBON_EDGE_RATE_LIMITER"
namespace_id = "902003"
  [ratelimits.simple]
  limit = 20
  period = 60

[vars]
ASK_CARBON_ACTIVATION = "disabled"
ASK_CARBON_RUNTIME_MODE = "production"
ASK_CARBON_PRIVACY_MODE = "approved_public_privacy_v2_chutes_confidential"
ASK_CARBON_STAGING_ACCESS_MODE = "none"
ASK_CARBON_EDGE_ACCESS_POLICY_ID = "public-origin-defense-in-depth-v1"
ASK_CARBON_EDGE_ABUSE_POLICY_ID = "cf-workers-rate-limit-902003-and-durable-ledger-v1"
ASK_CARBON_APPROVED_ORIGINS = "https://carbonphysics.ai,https://www.carbonphysics.ai"
ASK_CARBON_APPROVED_MODEL_CONFIGS = "gemma-4-31b-turbo-tee:v1"
ASK_CARBON_MODEL_CONFIG_ID = "gemma-4-31b-turbo-tee:v1"
ASK_CARBON_LEDGER_AUTHORITY_ID = "ask-carbon-provider-budget-v2"
ASK_CARBON_ENVIRONMENT = "production"
ASK_CARBON_OPERATIONAL_SCOPE_ID = "production"
ASK_CARBON_OPERATIONAL_SCOPE_LIMIT_MICRO_USD = "50000000"
ASK_CARBON_MONTHLY_LIMIT_MICRO_USD = "50000000"
ASK_CARBON_LEGACY_CLOSED_AUTHORITY_PERIOD = "2026-09"
ASK_CARBON_LEGACY_CLOSED_AUTHORITY_SCOPE_ID = "bakeoff"
ASK_CARBON_LEGACY_CLOSED_AUTHORITY_EXPOSURE_MICRO_USD = "80831"
ASK_CARBON_DAILY_REQUEST_LIMIT = "100"
ASK_CARBON_MAX_CONCURRENCY = "4"
ASK_CARBON_CLIENT_REQUESTS_PER_HOUR = "12"
ASK_CARBON_CLIENT_COUNTER_RETENTION_MS = "86400000"
ASK_CARBON_MAX_INPUT_TOKENS = "24000"
ASK_CARBON_MAX_OUTPUT_TOKENS = "700"
ASK_CARBON_PROVIDER_TIMEOUT_MS = "60000"
ASK_CARBON_PILOT_MAX_REQUESTS_PER_SESSION = "8"
ASK_CARBON_EVALUATION_TELEMETRY = "disabled"

# Provision only through Cloudflare secrets after owner release approval:
# ASK_CARBON_CHUTES_API_KEY (Chutes key for https://llm.chutes.ai/v1; the
#   retired ASK_CARBON_OPENAI_API_KEY is no longer read by this configuration
#   and may be deleted from the Worker after the owner confirms the switch)
# ASK_CARBON_CONTINUATION_SIGNING_SECRET
