name = "OWNER_DECISION_REQUIRED_PRIVATE_STAGING_APP"
main = "worker/index.mjs"
compatibility_date = "2026-09-16"
workers_dev = false

# This example intentionally declares no production route. The production
# project, zone, branch, and route owner were not established by the repository
# or the accessible Cloudflare session. A reviewed deployment configuration
# should bind only the exact /api/ask-carbon* route and preserve homepage
# routing.

# Every app environment must name the same separately deployed authority.
# A separate per-environment Durable Object namespace would incorrectly grant
# each environment its own USD 50 allowance.
[[durable_objects.bindings]]
name = "ASK_CARBON_USAGE_LEDGER"
class_name = "AskCarbonUsageLedger"
script_name = "OWNER_DECISION_REQUIRED_SHARED_BUDGET_AUTHORITY"

[vars]
ASK_CARBON_ACTIVATION = "disabled"
ASK_CARBON_RUNTIME_MODE = "staging"
ASK_CARBON_PRIVACY_MODE = "evaluation_public_synthetic_only"
ASK_CARBON_EDGE_ACCESS_POLICY_ID = "OWNER_DECISION_REQUIRED_PRIVATE_ACCESS_POLICY"
ASK_CARBON_EDGE_ABUSE_POLICY_ID = "OWNER_DECISION_REQUIRED_EDGE_RATE_LIMIT_POLICY"
ASK_CARBON_APPROVED_ORIGINS = "OWNER_DECISION_REQUIRED"
ASK_CARBON_APPROVED_MODEL_CONFIGS = "gpt-5.6-luna:low:v1,gpt-5.6-terra:low:v1"
ASK_CARBON_MODEL_CONFIG_ID = "gpt-5.6-luna:low:v1"
ASK_CARBON_LEDGER_AUTHORITY_ID = "ask-carbon-provider-budget-v2"
ASK_CARBON_ENVIRONMENT = "staging"
ASK_CARBON_OPERATIONAL_SCOPE_ID = "staging"
ASK_CARBON_OPERATIONAL_SCOPE_LIMIT_MICRO_USD = "50000000"
ASK_CARBON_MONTHLY_LIMIT_MICRO_USD = "50000000"
ASK_CARBON_DAILY_REQUEST_LIMIT = "100"
ASK_CARBON_MAX_CONCURRENCY = "4"
ASK_CARBON_CLIENT_REQUESTS_PER_HOUR = "12"
ASK_CARBON_CLIENT_COUNTER_RETENTION_MS = "86400000"
ASK_CARBON_MAX_INPUT_TOKENS = "24000"
ASK_CARBON_MAX_OUTPUT_TOKENS = "700"
ASK_CARBON_PROVIDER_TIMEOUT_MS = "15000"
ASK_CARBON_PILOT_MAX_REQUESTS_PER_SESSION = "OWNER_DECISION_REQUIRED"

# Secrets, never [vars]:
# - ASK_CARBON_OPENAI_API_KEY
# - ASK_CARBON_CONTINUATION_SIGNING_SECRET
